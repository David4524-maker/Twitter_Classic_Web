const $=s=>document.querySelector(s),COL=["#d9534f","#5cb85c","#8e6bbf","#e08a1e","#2a9fbf","#c2527a","#6a7f8e"];
let lang="es",mine=[],sim=[],ment=[],newq=[],liked=new Set(),rted=new Set(),fol=new Set(),muted=new Set(),ex=new Set(),saved=[],filter="",uid=0,view="home",unread=0,bio="",dms={},dmc="",dmSent=0,listI=-1,lists=[],photo=0,rep="",over=0,w0=0;
try{const s=localStorage.getItem("tcw-lang");if(s&&L[s])lang=s}catch(e){}

function build(){newq=[];ment=[];listI=-1;dmc="";dms={};T[lang].slice(0,3).forEach(p=>dms[p[1]]=[{t:p[2]}]);sim=T[lang].map((p,i)=>mk(p,i*9+Math.floor(Math.random()*6)))}
function ago(ts){const m=Math.floor((Date.now()-ts)/6e4);return m<1?L[lang][15]:m<60?m+"m":Math.floor(m/60)+"h"}

function item(w,newId){

function profHead(){
const t=L[lang],u=L2[lang];
return `<div class="pfh"><div class="av" style="background:#1da1c8">T</div><div><b>Tú</b> <span class="tm">@tu_usuario</span><div><input id="bio" value="${esc(bio)}" placeholder="${u[14]}" maxlength="80"><button class="fb" id="bs">${u[9]}</button></div><div class="tm">${mine.length} ${t[12]} · ${3+fol.size} ${t[13]} · ${fol.size} ${t[14]}</div></div></div>`}
function draw(newId){
const t=L[lang],u=L2[lang],f=filter.toLowerCase();
$("#cbox").hidden=view!=="home"&&view!=="profile";
$("#nb").hidden=!(view==="home"&&newq.length);$("#nb").textContent=newq.length+" "+u[6];
document.querySelectorAll(".nav a").forEach(a=>a.classList.toggle("on",a.dataset.v===view));
let h;
if(view==="dm")h=dmView();else{
let s=view==="mentions"?ment:view==="favs"?[...mine,...sim,...ment].filter(w=>liked.has(w.id)):view==="profile"?mine:[...mine,...sim];
s=s.filter(w=>!muted.has(w.h)&&(!f||((w.x||"")+w.n+w.h).toLowerCase().includes(f))&&(listI<0||view!=="home"||w.me||lists[listI][2].some(p=>p[1]===w.h))).sort((a,b)=>b.ts-a.ts);
if(view==="home"&&!f&&listI<0&&s.length>2)s.splice(2,0,PR);
h=(view==="profile"?profHead():"")+s.map(w=>item(w,newId)).join("");}
$("#tl").innerHTML=h;
$("#n1").textContent=t[1]+(unread?" ("+unread+")":"");
$("#s1").textContent=mine.length;$("#s2").textContent=3+fol.size;$("#s3").textContent=fol.size;
}
function side2(){
const t=L[lang],u=L2[lang],p=T[lang];
$("#gs").innerHTML=[[mine.length,t[4]],[fol.size,t[7]],[dmSent,u[0]]].map(x=>`<div>${x[0]?"☑":"☐"} ${x[1]}</div>`).join("");
lists=[["👥",u[20],p.slice(0,2)],["📰",u[21],p.slice(2,4)],["🎵",u[22],p.slice(4)]];
$("#ls").innerHTML=lists.map((l,i)=>`<a data-l="${i}" class="${i===listI?"on":""}">${l[0]} ${esc(l[1])}</a>`).join("");
$("#svb").hidden=!(saved.length||muted.size);
$("#sv2").innerHTML=saved.map((s,i)=>`<a data-q="${esc(s)}">🔍 ${esc(s)} <span data-rm="${i}" style="float:right">✕</span></a>`).join("")+[...muted].map(h=>`<a data-un="${esc(h)}">🔇 @${esc(h)} <span style="float:right">✕</span></a>`).join("");
}
function rot(){const p=T[lang];return[...p.slice(w0),...p.slice(0,w0)].slice(0,4)}
function sendDm(){
const i=$("#dmi"),v=i.value.trim();if(!v)return;
(dms[dmc]=dms[dmc]||[]).push({me:1,t:v});dmSent=1;const c=dmc;draw();side();$("#dmi").focus();
setTimeout(()=>{const x=T[lang][Math.floor(Math.random()*5)][2];dms[c].push({t:x});const m=document.querySelector(".dmm");if(view==="dm"&&dmc===c&&m){const d=document.createElement("div");d.className="mb";d.textContent=x;m.appendChild(d);m.scrollTop=m.scrollHeight}},1500)}
function side(){
const t=L[lang];
$("#who").innerHTML=rot().map(p=>`<div class="wf"><div class="av" style="background:${col(p[1])}">${esc(p[0][0])}</div><div><b>${esc(p[0])}</b>@${esc(p[1])}</div><button class="fb${fol.has(p[1])?" on":""}" data-h="${p[1]}">${fol.has(p[1])?t[8]:t[7]}</button></div>`).join("");
side2();$("#tr").innerHTML=TR[lang].split("|").map(x=>`<a data-q="${esc(x)}">${esc(x)}</a>`).join("");
}
function ui(){
const t=L[lang];
document.documentElement.lang=lang;document.documentElement.dir=lang==="ar"?"rtl":"ltr";
const u=L2[lang];$("#n0").textContent=t[0];$("#n1").textContent=t[1];$("#n2").textContent=u[0];$("#n3").textContent=u[1];$("#n4").textContent=u[2];$("#h3g").textContent=u[16];$("#h3l").textContent=u[7];$("#h3s").textContent=u[8];$("#ph").title=u[13];$("#sv").title=u[9];$("#bgc").title=u[19];$("#q").placeholder=t[2];$("#hp").textContent=t[3];$("#ta").placeholder=t[3];$("#go").textContent=t[4];
$("#h3a").textContent=t[6];$("#h3b").textContent=t[5];$("#l1").textContent=t[12];$("#l2").textContent=t[13];$("#l3").textContent=t[14];
$("#lg").value=lang;side();draw();
}
$("#lg").onchange=e=>{lang=e.target.value;try{localStorage.setItem("tcw-lang",lang)}catch(x){}build();ui()};
$("#ta").oninput=()=>{const n=140-$("#ta").value.length;$("#cnt").textContent=n;$("#cnt").className=n<20?"w":"";$("#go").disabled=!$("#ta").value.trim()};
$("#go").onclick=()=>{const v=$("#ta").value.trim();if(!v)return;if(!over&&Math.random()<.07){over=1;$("#fwt").textContent=L2[lang][18];$("#fw").hidden=false;return}over=0;const w={id:++uid,n:"Tú",h:"tu_usuario",x:v,ts:Date.now(),r:0,f:0,me:1,ph:photo,rep:rep&&v.startsWith("@"+rep)?rep:""};mine.unshift(w);$("#ta").value="";photo=0;rep="";$("#ph").classList.remove("on");$("#ta").oninput();draw(w.id);side()};

$("#tl").onclick=e=>{
const q=e.target.closest("[data-q]");if(q){filter=q.dataset.q;$("#q").value=filter;view="home";draw();return}
